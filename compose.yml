# Bundled single-origin setup: Postgres, the API, and nginx serving the SPA and
# proxying /api. Point a reverse proxy at the `web` service.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tavi}
      POSTGRES_USER: ${POSTGRES_USER:-tavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tavi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      # Left to the API's own resolution: it derives the connection string from
      # these, which keeps URL assembly (and encoding) in one place.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tavi}
      POSTGRES_USER: ${POSTGRES_USER:-tavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Public origin the browser uses. Setting the API URL to the same value
      # makes session cookies first-party (SameSite=Lax) instead of Secure-only
      # cross-site cookies, which a plain-HTTP setup cannot store.
      TAVI_CLIENT_URL: ${TAVI_PUBLIC_URL:-http://localhost:8080}
      TAVI_API_URL: ${TAVI_PUBLIC_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
