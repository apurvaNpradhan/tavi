# Serves the SPA and proxies the API on the same origin.
#
# Same-origin is deliberate: session cookies stay first-party, so no CORS
# configuration is needed and the browser sends them without SameSite=None.

server {
  listen 80;
  server_name _;

  # Docker's embedded DNS. Resolving the upstream through a variable (rather
  # than a literal hostname) makes nginx re-resolve it, so recreating the API
  # container — which assigns a new IP — does not leave the proxy pointing at a
  # dead address until nginx is reloaded.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Compression is a large win on the SPA bundle and on JSON API responses.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
    application/x-javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Hashed asset filenames make long-lived caching safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $api_upstream "http://api:1337";
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The index must not be cached, or a client can pin an old asset manifest.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths render the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
