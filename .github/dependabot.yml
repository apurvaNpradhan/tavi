version: 2
updates:
  # A single entry at the workspace root. This repo is a pnpm workspace with one
  # root pnpm-lock.yaml, so dependabot has to run from "/" to discover every
  # workspace package AND regenerate the shared lockfile. Targeting individual
  # subdirectories bumps each package.json but leaves the root lockfile stale,
  # which fails `pnpm install --frozen-lockfile` in CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      # Batch non-major updates into one PR to keep lockfile churn reviewable.
      # Majors still open individually so each one gets a real review.
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # The runtime images in apps/*/Dockerfile pin base tags, which drift the same
  # way dependencies do.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
