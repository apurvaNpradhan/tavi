name: Release

# Dispatched by hand, never on push: a release is a decision, not a side effect
# of merging. The plan job resolves the version first, so a run that has nothing
# releasable stops without creating a tag or a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Preview the version and notes without releasing anything"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # semantic-release verifies push permission even on a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Enforce dispatch from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch releases from main (ref: $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # semantic-release reads the full history to find the last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve next version
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -o pipefail
          pnpm exec semantic-release --dry-run 2>&1 | tee /tmp/release-plan.log

      - name: Summarise the plan
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            if [ -n "$VERSION" ]; then
              echo "## Release plan: v$VERSION"
            else
              echo "## No release"
              echo
              echo "No releasable commits since the last tag."
            fi
            echo
            echo "<details><summary>dry run output</summary>"
            echo
            echo '```'
            cat /tmp/release-plan.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # semantic-release comments on the issues and pull requests it released.
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # The same token the plan job used, so the release commit and tag are not
      # pushed under a different identity than the one that was verified.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release pushed with the default GITHUB_TOKEN does not trigger other
      # workflows, so set RELEASE_TOKEN if anything should run on the tag.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

      # The plan is what the run was reviewed against. A mismatch means the
      # history moved underneath it, so the release is not the one that was
      # approved.
      - name: Verify the released version matches the plan
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.release.outputs.version }}
        run: |
          if [ "$PLANNED" != "$RELEASED" ]; then
            echo "::error::Planned v$PLANNED but released v$RELEASED."
            exit 1
          fi
