name: Typecheck

# A fast, targeted signal on pull requests: the full CI job also builds images
# and runs the whole suite, which is slower than most reviews need.
on:
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @tavi/permissions build
          pnpm --filter @tavi/env build
          pnpm --filter @tavi/email build
      - run: pnpm typecheck
